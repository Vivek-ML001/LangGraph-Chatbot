<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-label="Project structure" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t { font-family: 'Courier New', Consolas, monospace; font-size: 14px; fill: #e6edf3; white-space: pre; }
    .c { fill: #7d8590; }
    .f { fill: #79c0ff; }
    .d { fill: #ffa657; }
    .h { font-family: -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #ffffff; font-weight: 600; }
    .l { opacity: 0; animation: show 10s infinite; }
    @keyframes show {
      0%   { opacity: 0; transform: translateX(-12px); }
      5%   { opacity: 1; transform: translateX(0); }
      88%  { opacity: 1; transform: translateX(0); }
      96%  { opacity: 0; transform: translateX(0); }
      100% { opacity: 0; }
    }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="760" height="340" rx="24" fill="#0d1117"/>
  <circle cx="34" cy="30" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="30" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="30" r="6" fill="#27c93f"/>
  <text x="100" y="35" class="h">Plaintext</text>

  <g class="t">
    <text class="l d" x="36" y="80"  style="animation-delay:0s">Lang_Graph_Chat/</text>

    <text class="l" x="36" y="104" style="animation-delay:.4s">├── <tspan class="d">assets/</tspan><tspan x="330" class="c"># Screenshots &amp; demo GIF</tspan></text>
    <text class="l" x="36" y="128" style="animation-delay:.8s">│   └── <tspan class="f">demo.gif</tspan></text>
    <text class="l" x="36" y="152" style="animation-delay:1.2s">├── .env<tspan x="330" class="c"># Environment variables (API keys)</tspan></text>
    <text class="l" x="36" y="176" style="animation-delay:1.6s">├── .gitignore<tspan x="330" class="c"># Excluded files</tspan></text>
    <text class="l" x="36" y="200" style="animation-delay:2s">├── README.md<tspan x="330" class="c"># Project documentation</tspan></text>
    <text class="l" x="36" y="224" style="animation-delay:2.4s">├── requirements.txt<tspan x="330" class="c"># Python dependencies</tspan></text>
    <text class="l" x="36" y="248" style="animation-delay:2.8s">├── chatbot.db<tspan x="330" class="c"># SQLite checkpoints (auto-generated)</tspan></text>
    <text class="l" x="36" y="272" style="animation-delay:3.2s">├── <tspan class="f">langgraph_backend.py</tspan><tspan x="330" class="c"># LangGraph state graph &amp; checkpointer</tspan></text>
    <text class="l" x="36" y="296" style="animation-delay:3.6s">└── <tspan class="f">streamlit_frontend.py</tspan><tspan x="330" class="c"># Streamlit multi-thread UI</tspan></text>

    <rect class="cursor" x="36" y="308" width="9" height="16" fill="#e6edf3"/>
  </g>
</svg>
